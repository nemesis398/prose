config:
  # Long lines are fine in prose and tables.
  MD013: false
  # The eval prompts start with front matter and a sentence, not a heading.
  MD041: false
ignores:
  - "evals/results/**"
  # The corpus and the reference fixture are bad Markdown on purpose.
  - "tests/**"
  - "reference/fixture.md"
  # Working notes of the build, never committed.
  - ".superpowers/**"
