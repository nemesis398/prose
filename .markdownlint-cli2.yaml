config:
  # Long lines are fine in prose and tables.
  MD013: false
  # The eval prompts start with front matter and a sentence, not a heading.
  MD041: false
  # Keep a Changelog repeats "Added" and "Changed" under every release.
  MD024:
    siblings_only: true
ignores:
  - "evals/results/**"
  # The corpus is bad Markdown on purpose. The rest of tests/ is linted.
  - "tests/corpus/**"
  # Working notes of the build, never committed.
  - ".superpowers/**"
