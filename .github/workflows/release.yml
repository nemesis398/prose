# A stand-in until the shared workflow of ravnix's foundation repository
# replaces it. On a tag vX.Y.Z equal to plugin.json's version: check.yml,
# which tests and builds the five binaries (the Intel Mac one is cross-compiled
# and tested on an Intel runner) exactly as on every push, then a release
# with the five binaries and SHA256SUMS,
# the files that skills/prose/install and install.ps1 fetch. The notes are
# the version's section of CHANGELOG.md, then GitHub's generated notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is v and plugin.json's version
        id: version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version in .claude-plugin/plugin.json"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  # The same tests and builds as every push, Windows PowerShell 5.1
  # included; its artifacts are the five binaries.
  check:
    needs: version
    uses: ./.github/workflows/check.yml

  release:
    needs: [version, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md, for the release notes. It comes first: a checkout
      # empties the workspace, and the artifacts are downloaded into it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prose-check-*
          path: assets
          merge-multiple: true
      - name: No versioned libcurl symbols in the Linux binaries
        working-directory: assets
        run: |
          for f in prose-check-linux-x86_64 prose-check-linux-arm64; do
            if readelf -V "$f" | grep -E 'File: libcurl|CURL_OPENSSL'; then
              echo "::error::$f requires versioned libcurl symbols; it would warn on every start where libcurl has none"
              exit 1
            fi
          done
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          # Bare names, one "<sha256>  <name>" line each; a missing binary
          # fails here.
          sha256sum prose-check-linux-x86_64 prose-check-linux-arm64 \
            prose-check-macos-arm64 prose-check-macos-x86_64 \
            prose-check-windows-x86_64.exe >SHA256SUMS
          cat SHA256SUMS
      - name: The version's section of CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # From the "## [VERSION]" line up to the next "## " line, the
          # heading itself left out. A release without a section is an error.
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The section comes first, GitHub's generated notes (the commits
          # and the contributors) after it.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "prose $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            prose-check-linux-x86_64 prose-check-linux-arm64 prose-check-macos-arm64 \
            prose-check-macos-x86_64 prose-check-windows-x86_64.exe SHA256SUMS
