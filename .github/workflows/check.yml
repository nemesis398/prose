# A stand-in until the shared workflow of ravnix's foundation repository
# replaces it. On every push it builds and tests the five release binaries
# the way a release does (release.yml calls this workflow), checks the
# repository's own prose with the freshly built checker, and validates the
# manifests and the Markdown.
name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  ODIN_RELEASE: dev-2026-10

jobs:
  test:
    name: test (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One push shows every platform's failures, not only the first one's.
      fail-fast: false
      matrix:
        include:
          # Linux builds in a manylinux_2_28 container (AlmaLinux 8, glibc
          # 2.28), whose libcurl has no symbol versions: a binary linked
          # against Ubuntu's libcurl requires CURL_OPENSSL_4, and the loader
          # warns about that on every start on Fedora and Arch.
          - os: ubuntu-24.04
            asset: prose-check-linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
            odin: odin-linux-amd64-dev-2026-10.tar.gz
            odin-sha256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
          - os: ubuntu-24.04-arm
            asset: prose-check-linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
            odin: odin-linux-arm64-dev-2026-10.tar.gz
            odin-sha256: 99c43e9670a285901d6cfee5f56197b74c7d6f7c537b35ecba0c1b44ac2e4df8
          - os: macos-15
            asset: prose-check-macos-arm64
            odin: odin-macos-arm64-dev-2026-10.tar.gz
            odin-sha256: b276c6ac87c3eea17446a6ca9080089b6e9f492057fb773591775ee49d92a1cf
            # Odin ships no macOS amd64 build, so this job also
            # cross-compiles the Intel binary. The test-intel job runs it.
            cross-target: darwin_amd64
            cross-asset: prose-check-macos-x86_64
          - os: windows-2025
            asset: prose-check-windows-x86_64.exe
            odin: odin-windows-amd64-dev-2026-10.zip
            odin-sha256: b6b2e426a8b6f147b74ec7e18bef8df27cf40fe16193159df7ca09a0cc0c2011
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      # The corpus and the golden files are compared byte for byte.
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Odin's Linux binary is static, so the copy unpacked here also runs
      # inside the container.
      - name: Install Odin
        if: runner.os != 'Windows'
        env:
          ODIN_ASSET: ${{ matrix.odin }}
          ODIN_SHA256: ${{ matrix.odin-sha256 }}
        run: |
          archive="$RUNNER_TEMP/$ODIN_ASSET"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/odin-lang/Odin/releases/download/$ODIN_RELEASE/$ODIN_ASSET"
          if command -v sha256sum >/dev/null; then
            echo "$ODIN_SHA256  $archive" | sha256sum -c -
          else
            echo "$ODIN_SHA256  $archive" | shasum -a 256 -c -
          fi
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >>"$GITHUB_PATH"
      - name: Install Odin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ODIN_ASSET: ${{ matrix.odin }}
          ODIN_SHA256: ${{ matrix.odin-sha256 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP $env:ODIN_ASSET
          curl.exe -fsSL --retry 3 -o $archive "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_RELEASE/$env:ODIN_ASSET"
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:ODIN_SHA256) { throw "$env:ODIN_ASSET has SHA-256 $sha, not $env:ODIN_SHA256" }
          # The archive holds one folder, dist.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'dist' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: odin version

      # Linux: one container for the job, started from a step (the image
      # has no node, which `container:` would need for the actions). It
      # runs as the runner's user, so the files it writes stay the runner's
      # and the tests that take permissions away are not run as root.
      - name: Start the build container (Linux)
        if: matrix.container
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          docker run -d --name build --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/odin:/odin:ro" -w /w \
            "$IMAGE" sleep infinity
          docker exec -u 0 build dnf install -y -q clang libcurl-devel zlib-devel
          docker exec -u 0 build ln -s /odin/odin /usr/local/bin/odin
          docker exec build odin version

      # Linux and macOS: the Makefile, one suite per step.
      - name: Odin tests
        if: runner.os != 'Windows'
        run: ${{ matrix.container && 'docker exec build ' || '' }}make test-odin
      - name: Install tests (POSIX)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: ${{ matrix.container && 'docker exec build ' || '' }}make test-install
      # On the runner itself: the container has no pwsh.
      - name: Install tests (PowerShell, where pwsh is installed)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: make test-install-ps1
      - name: Build
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          ${{ matrix.container && 'docker exec build ' || '' }}make build
          mkdir -p dist
          cp skills/prose/bin/prose-check "dist/$ASSET"
      - name: Check the repository's prose with the built checker
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: ${{ matrix.container && 'docker exec build ' || '' }}make doccheck
      # After doccheck, which needs the native binary in bin/. The Intel
      # binary is not run here: an arm64 runner may lack Rosetta.
      - name: Cross-compile the Intel binary (macOS)
        if: ${{ !cancelled() && matrix.cross-target }}
        env:
          CROSS_TARGET: ${{ matrix.cross-target }}
          CROSS_ASSET: ${{ matrix.cross-asset }}
        run: |
          make build TARGET="$CROSS_TARGET"
          cp skills/prose/bin/prose-check "dist/$CROSS_ASSET"
          file "dist/$CROSS_ASSET"
          lipo -archs "dist/$CROSS_ASSET" | grep -qx x86_64
      # The Odin tests, built for Intel and run on the Intel job, so the
      # libcurl calls (the languagetool tests, against the fake server) run
      # on x86_64.
      - name: Cross-compile the Odin test runner for Intel (macOS)
        if: ${{ !cancelled() && matrix.cross-target }}
        env:
          CROSS_TARGET: ${{ matrix.cross-target }}
        run: |
          make build-odin-tests TARGET="$CROSS_TARGET" TEST_OUT=dist/prose-tests-macos-x86_64
          file dist/prose-tests-macos-x86_64
          lipo -archs dist/prose-tests-macos-x86_64 | grep -qx x86_64
      - name: No versioned libcurl symbols (Linux)
        if: ${{ !cancelled() && matrix.container }}
        run: |
          readelf -V "dist/$ASSET"
          if readelf -V "dist/$ASSET" | grep -E 'File: libcurl|CURL_OPENSSL'; then
            echo "::error::$ASSET requires versioned libcurl symbols; it would warn on every start where libcurl has none"
            exit 1
          fi

      # Windows has no make: the same commands in PowerShell. The POSIX
      # install test and the hunspell stubs do not run here.
      - name: Odin tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          odin test tests -vet -o:speed -microarch:x86-64-v2 -define:ODIN_TEST_RANDOM_SEED=1 -define:ODIN_TEST_TRACK_MEMORY=true -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -define:ODIN_TEST_FANCY=false
      - name: Install tests under PowerShell 7 (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tests/install_test.ps1
      # Started from Windows PowerShell itself, so no PowerShell 7 module
      # path leaks into it.
      - name: Install tests under Windows PowerShell 5.1 (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/install_test.ps1
      - name: Build (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content -LiteralPath .claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path skills/prose/bin, dist | Out-Null
          odin build src "-out:skills/prose/bin/prose-check.exe" -vet -o:speed -microarch:x86-64-v2 "-define:PROSE_VERSION=$version"
          Copy-Item -LiteralPath skills/prose/bin/prose-check.exe -Destination "dist/$env:ASSET"
      - name: Check the repository's prose with the built checker (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The same files as `make doccheck`, read from the Makefile.
          $patterns = ((Select-String -LiteralPath Makefile -Pattern '^DOCS := (.+)$').Matches[0].Groups[1].Value -split '\s+')
          $docs = @(foreach ($p in $patterns) { (Get-ChildItem -Path $p -File).FullName })
          ./skills/prose/bin/prose-check.exe --no-lt @docs

      # What both installers ask of an installed binary, run on the runner
      # itself (for Linux, outside the container it was built in): exactly
      # the version on stdout, and nothing on stderr. This does not catch the
      # libcurl loader warning on CI: the runner's libcurl has symbol
      # versions, so the warning appears only on a system whose libcurl has
      # none (Fedora, Arch). The readelf step above is the gate for that.
      - name: The binary runs, names the version, and says nothing else
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json)
          got=$("./dist/$ASSET" --version 2>"$RUNNER_TEMP/stderr")
          if [ "$got" != "prose-check $version" ] || [ -s "$RUNNER_TEMP/stderr" ]; then
            echo "::error::$ASSET --version printed '$got' and on stderr: $(cat "$RUNNER_TEMP/stderr")"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Intel binary (macOS)
        if: ${{ matrix.cross-asset }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cross-asset }}
          path: dist/${{ matrix.cross-asset }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Intel Odin test runner (macOS)
        if: ${{ matrix.cross-asset }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prose-tests-macos-x86_64
          path: dist/prose-tests-macos-x86_64
          if-no-files-found: error
          retention-days: 7

  # The cross-compiled Intel binary, run on an Intel runner. Odin has no
  # build for it, so nothing is built here: the arm64 job cross-compiles the
  # binary and the Odin test runner, and this job runs both and the installer
  # tests.
  test-intel:
    name: test (prose-check-macos-x86_64)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    env:
      ASSET: prose-check-macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prose-check-macos-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prose-tests-macos-x86_64
          path: dist
      - name: Odin tests, on the Intel build
        run: |
          chmod +x dist/prose-tests-macos-x86_64
          ./dist/prose-tests-macos-x86_64
      - name: Put the binary where the Makefile expects it
        run: |
          chmod +x "dist/$ASSET"
          mkdir -p skills/prose/bin
          cp "dist/$ASSET" skills/prose/bin/prose-check
          file skills/prose/bin/prose-check
      - name: The binary runs, names the version, and says nothing else
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json)
          got=$("./dist/$ASSET" --version 2>"$RUNNER_TEMP/stderr")
          if [ "$got" != "prose-check $version" ] || [ -s "$RUNNER_TEMP/stderr" ]; then
            echo "::error::$ASSET --version printed '$got' and on stderr: $(cat "$RUNNER_TEMP/stderr")"
            exit 1
          fi
      - name: Install tests (POSIX)
        if: ${{ !cancelled() }}
        run: make test-install
      - name: Check the repository's prose with the Intel binary
        if: ${{ !cancelled() }}
        run: make doccheck

  manifests-and-markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate the plugin and the marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.326 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.326 plugin validate .claude-plugin/marketplace.json
      - name: Lint the Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
